name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maintenance version to build
        required: true
        default: v0.9.0-r1
  push:
    tags:
      - "v0.9.0-r*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go 1.20.14
        uses: actions/setup-go@v7
        with:
          go-version: 1.20.14
          cache: true
      - name: Validate
        env:
          GOFLAGS: -mod=readonly
        run: |
          go version
          go test ./...
          go vet ./...
          go test -race ./...

  build:
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, goarm: "", asset: linux-64 }
          - { goos: linux, goarch: "386", goarm: "", asset: linux-32 }
          - { goos: linux, goarch: arm64, goarm: "", asset: linux-arm64-v8a }
          - { goos: linux, goarch: arm, goarm: "7", asset: linux-arm32-v7a }
          - { goos: linux, goarch: arm, goarm: "6", asset: linux-arm32-v6a }
          - { goos: linux, goarch: arm, goarm: "5", asset: linux-arm32-v5 }
          - { goos: linux, goarch: riscv64, goarm: "", asset: linux-riscv64 }
          - { goos: linux, goarch: mips, goarm: "", asset: linux-mips32 }
          - { goos: linux, goarch: mipsle, goarm: "", asset: linux-mips32le }
          - { goos: linux, goarch: mips64, goarm: "", asset: linux-mips64 }
          - { goos: linux, goarch: mips64le, goarm: "", asset: linux-mips64le }
          - { goos: linux, goarch: ppc64le, goarm: "", asset: linux-ppc64le }
          - { goos: linux, goarch: s390x, goarm: "", asset: linux-s390x }
          - { goos: windows, goarch: amd64, goarm: "", asset: windows-64 }
          - { goos: windows, goarch: "386", goarm: "", asset: windows-32 }
          - { goos: darwin, goarch: amd64, goarm: "", asset: macos-64 }
          - { goos: darwin, goarch: arm64, goarm: "", asset: macos-arm64-v8a }
          - { goos: freebsd, goarch: amd64, goarm: "", asset: freebsd-64 }
          - { goos: freebsd, goarch: "386", goarm: "", asset: freebsd-32 }
          - { goos: freebsd, goarch: arm64, goarm: "", asset: freebsd-arm64-v8a }
          - { goos: freebsd, goarch: arm, goarm: "7", asset: freebsd-arm32-v7a }
          - { goos: openbsd, goarch: amd64, goarm: "", asset: openbsd-64 }
          - { goos: dragonfly, goarch: amd64, goarm: "", asset: dragonfly-64 }
          - { goos: android, goarch: arm64, goarm: "", asset: android-arm64-v8a }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go 1.20.14
        uses: actions/setup-go@v7
        with:
          go-version: 1.20.14
          cache: true
      - name: Build deterministic archive
        env:
          GOFLAGS: -mod=readonly
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          ./scripts/build-release.sh \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            "${{ matrix.goarm }}" \
            "${{ matrix.asset }}" \
            "${VERSION}" \
            dist
      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/XrayR-${{ matrix.asset }}.zip
            dist/XrayR-${{ matrix.asset }}.zip.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --verify-tag \
              --title "oldxr ${TAG}" \
              --notes "仍基于 XrayR v0.9.0、xray-core v1.7.5，并保持 V2Board 1.6.0 legacy API 兼容。本维护版包含已验证的计费正确性、并发安全、limiter、ETag、stats 与规则处理修复；详细测试和已知限制见仓库 docs/engineering-reports。"
          fi
          gh release upload "${TAG}" dist/* --clobber
