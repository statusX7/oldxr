name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (v1.0.N)
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  GO_VERSION: 1.26.7

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Race
        run: go test -mod=readonly -race ./...
      - name: Check release scripts
        run: |
          bash -n install.sh XrayR.sh scripts/*.sh
          shellcheck -x install.sh XrayR.sh scripts/*.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset: linux-64
          - goarch: arm64
            asset: linux-arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y binutils file shellcheck zip
      - name: Select release version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_version="${DISPATCH_VERSION}"
          else
            release_version="${GITHUB_REF_NAME}"
          fi
          [[ "${release_version}" =~ ^v1\.0\.[0-9]+$ ]]
          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
      - name: Build deterministic archive
        run: >-
          scripts/build-release.sh linux
          "${{ matrix.goarch }}" "" "${{ matrix.asset }}"
          "${{ steps.release.outputs.version }}" dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayR-${{ matrix.asset }}
          path: |
            dist/XrayR-${{ matrix.asset }}.zip
            dist/XrayR-${{ matrix.asset }}.zip.sha256
          if-no-files-found: error
